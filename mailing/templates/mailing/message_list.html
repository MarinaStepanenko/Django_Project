{% extends "base.html" %}

{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        {% if user.is_authenticated %}
            <div class="mb-3">
                <a href="{% url 'mailing:message_create' %}" class="btn btn-success">Добавить сообщение</a>
            </div>
        {% endif %}
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for message in messages %}
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">

                        <p class="card-text fw-bold">{{ message.subject }}</p>
                        <!-- Коммент -->
                      <p class="card-text text-muted">
                            {{ message.text_body }}
                        </p>
                      <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-primary" href="{% url 'mailing:message_detail' message.pk %}" role="button">Подробнее</a>
                                    <a class="btn btn-warning" href="{% url 'mailing:message_update' message.pk %}" role="button">Редактировать</a>
                                    <a class="btn btn-danger" href="{% url 'mailing:message_delete' message.pk %}" role="button">Удалить</a>
                            </div>
                      </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
