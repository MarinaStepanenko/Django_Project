{% extends "base.html" %}

{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        {% if user.is_authenticated %}
            <div class="mb-3">
                <a href="{% url 'mailing:create' %}" class="btn btn-success">Добавить получателя</a>
            </div>
        {% endif %}
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for recipient in recipients %}
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <!-- ФИО получателя -->
                        <p class="card-text fw-bold">{{ recipient.full_name }}</p>
                        <!-- Почта получателя -->
                        <p class="card-text fw-bold">{{ recipient.email }}</p>
                        <!-- Коммент -->
                        <p class="card-text text-muted">
                            {{ recipient.comment|truncatechars:100 }}
                        </p>
                      <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-primary" href="{% url 'mailing:recipient_detail' recipient.pk %}" role="button">Подробнее</a>
                                    <a class="btn btn-warning" href="{% url 'mailing:update' recipient.pk %}" role="button">Редактировать</a>
                                    <a class="btn btn-danger" href="{% url 'mailing:delete' recipient.pk %}" role="button">Удалить</a>
                            </div>
                      </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
