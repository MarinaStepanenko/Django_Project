{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h3>Удаление рассылки</h3>
                </div>
                <div class="card-body">
                    <p>Вы уверены, что хотите удалить рассылку
                        с <strong>{{ object.start_time|date:"d.m.Y H:i" }}</strong>
                        по <strong>{{ object.end_time|date:"d.m.Y H:i" }}</strong>?
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                        <a href="{% url 'mailing:mailing_list' %}" class="btn btn-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
