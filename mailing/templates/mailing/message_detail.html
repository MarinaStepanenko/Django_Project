{% extends "base.html" %}

{% block content %}
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header">

                        <h2>Тема письма: {{ message.subject }}</h2>
                    </div>
                    <div class="card-body">
                            <p><strong>Тело письма: </strong>{{ message.text_body }}</p>
                    </div>
                    <div class="card-footer">
                        <div class="btn-group">
                                    <a class="btn btn-warning" href="{% url 'mailing:message_update' message.pk %}" role="button">Редактировать</a>
                                    <a class="btn btn-danger" href="{% url 'mailing:message_delete' message.pk %}" role="button">Удалить</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
