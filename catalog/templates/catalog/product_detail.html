{% extends "base.html" %}

{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <!-- ФИО получателя -->
                        <p class="card-text fw-bold">ФИО: {{ recipient.full_name }}</p>
                        <!-- Почта -->
                        <p class="card-text fw-bold">Почта: {{ recipient.email }}</p>
                        <!-- комментарий (обрезано до 100 символов) -->
                        <p class="card-text text-muted">
                            {{ recipient.comment|truncatechars:100 }}
                        </p>

                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">

                                <a class="btn btn-primary" href="{% url 'mailing:recipient_detail' recipient.pk %}" role="button">Подробнее</a>
                                    <a class="btn btn-warning" href="{% url 'mailing:update' recipient.pk %}" role="button">Редактировать</a>
                                    <a class="btn btn-danger" href="{% url 'mailing:delete' recipient.pk %}" role="button">Удалить</a>

                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
