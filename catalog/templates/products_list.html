{% extends "base.html" %}

{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for product in products %}
            <div class="col">
                <div class="card shadow-sm">
                   {% if product.photo %}
                    <img src="{{ product.photo.url }}" class="card-img-top" alt="{{ product.name }}">
                        {% else %}
                    <img src="https://via.placeholder.com/600x300?text=Нет+фото" class="card-img-top" alt="Нет изображения">
                    {% endif %}
                    <div class="card-body">
                        <!-- НАЗВАНИЕ ТОВАРА -->
                        <p class="card-text fw-bold">{{ product.name }}</p>

                        <!-- ОПИСАНИЕ ТОВАРА (обрезано до 100 символов) -->
                        <p class="card-text text-muted">
                            {{ product.description|truncatechars:100 }}
                        </p>

                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-primary" href="{% url 'catalog:product_details' product.pk %}" role="button">Link</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
