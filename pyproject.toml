[project]
name = "project-django"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django (>=6.0.4,<7.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "ipython (>=9.13.0,<10.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.flake8]
max-line-length = 120
exclude = [
    "*/migrations/*",
    "*/__pycache__/*",
    ".git",
    ".venv",
    "venv"
]


[dependency-groups]
dev = [
    "flake8-pyproject (>=1.2.4,<2.0.0)"
]
