{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                    <button type="submit" class="btn btn-success">Зарегистрироваться</button>
                </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
